plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'me.eternalhuman'
version = '1.0.0-SNAPSHOT'
description = 'Powerful feature-packed Minecraft scoreboard library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'PacketBoard'
        }
    }
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

def adventureVersion = '4.16.0'
def paperVersion = '1.20.1-R0.1-SNAPSHOT'
def viaVersionVersion = '5.5.0'
def viaNBTVersion = '5.1.2'
def lombokVersion = '1.18.30'
def foliaLibVersion = '0.5.1'

allprojects {
    apply plugin: 'java-library'

    repositories {
        mavenCentral()

        maven { url 'https://repo.tcoded.com/releases' }
        maven { url 'https://jitpack.io' }
        maven { url 'https://repo.papermc.io/repository/maven-public/' }
        maven { url 'https://hub.spigotmc.org/nexus/content/groups/public/' }
        maven { url 'https://repo.dmulloy2.net/content/groups/public/' }
        maven { url 'https://oss.sonatype.org/content/groups/public/' }
        maven { url 'https://repo.viaversion.com' }
        maven { url 'https://repo.maven.apache.org/maven2/' }
        maven { url 'https://repo.opencollab.dev/maven-releases/' }
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
        testImplementation 'org.mockito:mockito-core:5.7.0'
        testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
        testImplementation 'org.powermock:powermock-api-mockito2:2.0.9'

        compileOnly "io.papermc.paper:paper-api:${paperVersion}"
        testCompileOnly "io.papermc.paper:paper-api:${paperVersion}"

        implementation "com.viaversion:nbt:${viaNBTVersion}"
        implementation("com.tcoded:FoliaLib:${foliaLibVersion}")

        compileOnly "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        compileOnly "com.viaversion:viaversion-api:${viaVersionVersion}"
        compileOnly "com.viaversion:viaversion-bukkit:${viaVersionVersion}"

        compileOnly 'io.netty:netty-buffer:4.1.101.Final'
        compileOnly 'io.netty:netty-handler:4.1.101.Final'

        compileOnly "net.kyori:adventure-api:${adventureVersion}"
        compileOnly "net.kyori:adventure-text-minimessage:${adventureVersion}"
        compileOnly "net.kyori:adventure-text-serializer-gson:${adventureVersion}"
        compileOnly "net.kyori:adventure-text-serializer-legacy:${adventureVersion}"
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
